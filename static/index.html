<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sinji Delfin</title>
  <link rel="icon" href="images/favicon_io/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon_io/apple-touch-icon.png" />
  <style>
    :root {
      /* Warm app canvas (login + chat); solid fallback under layered gradient */
      --app-warm-bg:
        radial-gradient(ellipse 130% 90% at 50% -25%, rgba(25, 195, 125, 0.2) 0%, transparent 58%),
        radial-gradient(ellipse 70% 50% at 100% 85%, rgba(212, 165, 116, 0.13) 0%, transparent 45%),
        radial-gradient(ellipse 60% 45% at 0% 90%, rgba(139, 160, 200, 0.1) 0%, transparent 42%),
        linear-gradient(168deg, #3d3b48 0%, #34323c 42%, #2c2a34 100%);
      --bg-main: #343541;
      --bg-sidebar: #202123;
      --bg-composer: #40414f;
      --bg-user: #343541;
      --bg-assistant: transparent;
      --border: rgba(255, 255, 255, 0.1);
      --text: #ececf1;
      --muted: #8e8ea0;
      --accent: #19c37d;
      --accent-hover: #1a9f6a;
      --danger: #f87171;
      --sidebar-width: 260px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Söhne", "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #2c2a34;
      background-image: var(--app-warm-bg);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
    }

    /* —— Login (warm, professional) —— */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: transparent;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(52, 50, 60, 0.97) 0%, rgba(38, 36, 44, 0.98) 100%);
      border: 1px solid rgba(255, 245, 235, 0.1);
      border-radius: 18px;
      padding: 2rem 1.9rem 1.9rem;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 28px 56px -16px rgba(0, 0, 0, 0.55),
        0 0 100px -30px rgba(25, 195, 125, 0.12);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.35rem;
    }
    .login-logo {
      max-height: 64px;
      width: auto;
      max-width: 260px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .login-title {
      font-size: 1.375rem;
      font-weight: 600;
      margin: 0 0 0.45rem;
      letter-spacing: -0.025em;
      color: #f4f2ed;
    }
    .login-card .sub {
      color: #a8a4b0;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0 0 1.2rem;
    }
    .login-demo {
      margin: 0 0 1.15rem;
      font-size: 0.8125rem;
      color: #9b97a8;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      background: rgba(255, 248, 240, 0.04);
      border: 1px solid rgba(255, 245, 235, 0.07);
      line-height: 1.45;
    }
    .login-demo code {
      color: #ebe6df;
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", monospace;
      font-size: 0.88em;
      padding: 0.12em 0.35em;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.2);
    }
    .login-card label {
      display: block;
      font-size: 0.8rem;
      color: #b4b0bc;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .login-card input {
      width: 100%;
      padding: 0.72rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 245, 235, 0.1);
      background: rgba(15, 14, 18, 0.55);
      color: var(--text);
      margin-bottom: 0.9rem;
      font-size: 0.95rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .login-card input::placeholder {
      color: #6d6a75;
    }
    .login-card input:hover {
      border-color: rgba(255, 245, 235, 0.14);
    }
    .login-card input:focus {
      outline: none;
      border-color: rgba(25, 195, 125, 0.5);
      box-shadow: 0 0 0 3px rgba(25, 195, 125, 0.14);
    }
    .login-card .btn-wide {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.72rem 1rem;
      font-weight: 600;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(25, 195, 125, 0.2);
    }
    .login-card .btn-wide:hover:not(:disabled) {
      box-shadow: 0 4px 18px rgba(25, 195, 125, 0.28);
    }

    .hidden { display: none !important; }
    .err { color: var(--danger); font-size: 0.875rem; margin-top: 0.65rem; }

    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 0.6rem 1rem;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }

    /* —— App shell —— */
    .app-shell {
      display: flex;
      height: 100vh;
      min-height: 0;
      background: transparent;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      min-height: 0;
    }
    .sidebar-brand-logo {
      max-height: 30px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    .sidebar-brand-text {
      min-width: 0;
      line-height: 1.2;
    }
    .sidebar-new {
      padding: 0.65rem 0.75rem;
    }
    .sidebar-new .btn-new {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.875rem;
    }
    .sidebar-new .btn-new:hover { background: rgba(255, 255, 255, 0.06); }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.35rem 0.5rem 0.75rem;
      min-height: 0;
    }
    .chat-list-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.65rem;
      margin-bottom: 2px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.8125rem;
      line-height: 1.35;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-list-item:hover { background: rgba(255, 255, 255, 0.06); }
    .chat-list-item.active {
      background: rgba(255, 255, 255, 0.1);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .sidebar-footer strong { color: var(--text); font-size: 0.8125rem; display: block; margin-bottom: 0.25rem; }
    .sidebar-footer .groups { font-size: 0.7rem; opacity: 0.9; margin-bottom: 0.5rem; word-break: break-word; }
    .sidebar-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .btn-icon {
      padding: 0.4rem 0.55rem;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .btn-icon:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }

    /* —— Main column —— */
    .main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: transparent;
    }
    .main-fill {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .main-inner {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 48rem;
      margin: 0 auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    .main-col.chat-empty .main-fill {
      justify-content: center;
      padding: 2rem 0;
    }
    .main-col.chat-empty .main-inner {
      flex: 0 1 auto;
      justify-content: center;
    }

    /* Prazen pogovor: naslov + ikona (Hackathon / javna uprava) */
    .welcome-block {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 0.5rem 1.5rem;
      max-width: 36rem;
      margin: 0 auto;
    }
    .main-col.chat-empty .welcome-block {
      display: flex;
    }
    .welcome-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.4rem;
    }
    .welcome-icon img {
      max-height: 88px;
      width: auto;
      max-width: 220px;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .welcome-title {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .welcome-sub {
      margin: 0 0 0.65rem;
      font-size: 1rem;
      line-height: 1.45;
      color: var(--text);
      font-weight: 500;
    }
    .welcome-hint {
      margin: 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 28rem;
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .main-col.chat-empty .messages-scroll {
      display: none;
    }
    .messages-inner {
      max-width: 48rem;
      margin: 0 auto;
      width: 100%;
      padding: 1.25rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .msg-row {
      display: flex;
      justify-content: flex-end;
    }
    .msg-row.assistant { justify-content: flex-start; }
    .msg {
      max-width: 85%;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.9375rem;
      line-height: 1.55;
    }
    .msg.user {
      background: var(--bg-composer);
      color: var(--text);
    }
    .msg.bot {
      background: var(--bg-assistant);
      border: none;
      max-width: 100%;
      padding-left: 0;
    }
    .msg-role {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .bot-answer {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }
    .perm-note {
      font-size: 0.8125rem;
      color: var(--muted);
      margin: 0 0 0.65rem;
      padding: 0.55rem 0.65rem;
      background: rgba(234, 179, 8, 0.08);
      border-radius: 8px;
      border-left: 3px solid rgba(234, 179, 8, 0.5);
    }

    .sources-details {
      margin-top: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .sources-summary {
      list-style: none;
      cursor: pointer;
      padding: 0.65rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
    }
    .sources-summary:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .sources-summary::-webkit-details-marker { display: none; }
    .sources-summary-left { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .sources-chevron {
      color: var(--muted);
      transition: transform 0.2s;
    }
    .sources-details[open] .sources-chevron { transform: rotate(180deg); color: var(--accent); }
    .sources-chevron svg { width: 14px; height: 14px; display: block; }
    .sources-body { padding: 0 0.85rem 0.85rem; border-top: 1px solid var(--border); }
    .sources-hint { font-size: 0.75rem; color: var(--muted); margin: 0.5rem 0 0; line-height: 1.45; }
    /* auto-fit collapses empty tracks so 1–2 chunks span full width; not narrow columns like auto-fill */
    .chunk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 0.65rem;
      margin-top: 0.65rem;
    }
    .chunk-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      background: var(--bg-composer);
      min-height: 6rem;
      min-width: 0;
      width: 100%;
    }
    .chunk-card-header {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .chunk-card-text {
      font-size: 0.8rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chunk-card-meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.5rem;
      padding-top: 0.45rem;
      border-top: 1px solid var(--border);
    }
    .count-pill {
      font-size: 0.65rem;
      padding: 0.12rem 0.4rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* —— Composer —— */
    .composer-outer {
      padding: 0.75rem 0 1.25rem;
      background: transparent;
      flex-shrink: 0;
    }
    .main-col:not(.chat-empty) .composer-outer {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }
    .main-col.chat-empty .composer-outer {
      padding-bottom: 0.5rem;
      margin-top: 0.25rem;
    }
    .composer-inner {
      max-width: 48rem;
      margin: 0 auto;
      width: 100%;
    }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      background: var(--bg-composer);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 0.45rem 0.55rem 0.45rem 1rem;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
    }
    .composer:focus-within {
      border-color: rgba(255, 255, 255, 0.2);
    }
    #chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 200px;
      padding: 0.5rem 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9375rem;
      line-height: 1.45;
      resize: none;
      outline: none;
    }
    .btn-send {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1px;
    }
    .btn-send:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-send svg { width: 18px; height: 18px; }
    .chat-err-wrap { width: 100%; padding: 0; margin-bottom: 0.35rem; }
  </style>
</head>
<body>
  <div id="login-panel" class="login-screen">
    <div class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <img
          class="login-logo"
          src="images/logo2.png"
          width="256"
          height="256"
          alt=""
          decoding="async"
        />
      </div>
      <h1 id="login-title" class="login-title">Prijavite se</h1>
      <p class="sub">
        Klepet z vlogo omejenim dostopom do dokumentov. Za nadaljevanje vnesite svoje podatke.
      </p>

      <label for="username">Uporabniško ime</label>
      <input id="username" type="text" autocomplete="username" placeholder="npr. uporabnik" />
      <label for="password">Geslo</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button type="button" class="btn-primary btn-wide" id="btn-login">Prijava</button>
      <div id="login-err" class="err hidden"></div>
    </div>
  </div>

  <div id="chat-panel" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img
          class="sidebar-brand-logo"
          src="images/logo2.png"
          width="256"
          height="256"
          alt=""
          decoding="async"
        />
        <span class="sidebar-brand-text">Pogovori</span>
      </div>
      <div class="sidebar-new">
        <button type="button" class="btn-new" id="btn-new-chat" title="Nov pogovor">
          <span style="font-size:1.1rem;line-height:1;">+</span> Nov pogovor
        </button>
      </div>
      <div id="chat-list" class="chat-list" role="list"></div>
      <div class="sidebar-footer">
        <strong id="me-name"></strong>
        <div class="groups" id="me-groups"></div>
        <div class="sidebar-actions">
          <button type="button" class="btn-icon" id="btn-delete-chat" title="Izbriši ta pogovor">Izbriši pogovor</button>
          <button type="button" class="btn-icon" id="btn-logout">Odjava</button>
        </div>
      </div>
    </aside>

    <main class="main-col chat-empty" id="main-col">
      <div class="main-fill" id="main-fill">
        <div class="main-inner" id="main-inner">
          <header class="welcome-block" id="welcome-block" aria-hidden="false">
            <div class="welcome-icon" aria-hidden="true">
              <img
                src="images/logo2.png"
                width="256"
                height="256"
                alt=""
                decoding="async"
              />
            </div>
            <!-- <h1 class="welcome-title">Sinji Delfini</h1> -->
            <p class="welcome-sub">Sistem AI pomočnikov z nadzorovanim dostopom za javno upravo</p>
            <p class="welcome-hint">
              Klepeta z iskanjem po dokumentih,  pravicami glede na vlogo in usmeritvijo,
              če informacije niso na voljo.
            </p>
          </header>
          <div class="messages-scroll" id="messages-scroll">
            <div id="messages" class="messages-inner"></div>
          </div>
          <div class="composer-outer" id="composer-outer">
            <div class="chat-err-wrap"><div id="chat-err" class="err hidden"></div></div>
            <div class="composer-inner">
              <div class="composer">
                <textarea id="chat-input" rows="1" placeholder="Postavite vprašanje o dokumentih…"></textarea>
                <button type="button" class="btn-send" id="btn-send" title="Pošlji" aria-label="Pošlji">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const TOKEN_KEY = "sinji_access_token";
    const CHAT_ID_KEY = "sinji_last_chat_id";
    let currentChatId = null;

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    }

    function displayUserMessageForUi(content) {
      const markers = ["Vprašanje:\n", "Question:\n"];
      for (let i = 0; i < markers.length; i++) {
        const marker = markers[i];
        const idx = content.lastIndexOf(marker);
        if (idx !== -1) {
          const q = content.slice(idx + marker.length).trim();
          if (q) return q;
        }
      }
      return content;
    }

    function steviloIzvlekov(n) {
      if (n === 1) return "1 izvlek";
      if (n >= 2 && n <= 4) return n + " izvleka";
      return n + " izvlekov";
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { ...options, headers });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; }
      catch (_) { data = { detail: text || res.statusText }; }
      if (!res.ok) {
        const msg = (data && data.detail)
          ? (Array.isArray(data.detail) ? data.detail.map((d) => d.msg || d).join(", ") : data.detail)
          : res.statusText;
        throw new Error(msg);
      }
      return data;
    }

    async function apiDelete(path) {
      const headers = {};
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { method: "DELETE", headers });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; }
      catch (_) { data = { detail: text || res.statusText }; }
      if (!res.ok) {
        const msg = (data && data.detail)
          ? (Array.isArray(data.detail) ? data.detail.map((d) => d.msg || d).join(", ") : data.detail)
          : res.statusText;
        throw new Error(msg);
      }
      return data;
    }

    const loginPanel = document.getElementById("login-panel");
    const chatPanel = document.getElementById("chat-panel");
    const mainCol = document.getElementById("main-col");
    const loginErr = document.getElementById("login-err");
    const chatErr = document.getElementById("chat-err");
    const messagesEl = document.getElementById("messages");
    const messagesScroll = document.getElementById("messages-scroll");
    const chatListEl = document.getElementById("chat-list");
    const welcomeBlock = document.getElementById("welcome-block");

    function syncEmptyChatLayout() {
      const empty = messagesEl.children.length === 0;
      if (mainCol) mainCol.classList.toggle("chat-empty", empty);
      if (welcomeBlock) welcomeBlock.setAttribute("aria-hidden", empty ? "false" : "true");
    }

    function scrollMessagesToBottom() {
      messagesScroll.scrollTop = messagesScroll.scrollHeight;
    }

    function showLogin() {
      loginPanel.classList.remove("hidden");
      chatPanel.classList.add("hidden");
      setToken(null);
      sessionStorage.removeItem(CHAT_ID_KEY);
      currentChatId = null;
    }

    function showChat() {
      loginPanel.classList.add("hidden");
      chatPanel.classList.remove("hidden");
    }

    function appendUser(text) {
      const row = document.createElement("div");
      row.className = "msg-row";
      const div = document.createElement("div");
      div.className = "msg user";
      div.textContent = text;
      row.appendChild(div);
      messagesEl.appendChild(row);
      scrollMessagesToBottom();
      syncEmptyChatLayout();
    }

    async function renderChatList() {
      const data = await api("/chat/list");
      const chats = data.chats || [];
      chatListEl.innerHTML = "";
      if (chats.length === 0) return;

      const valid = currentChatId != null && chats.some((c) => c.id === currentChatId);
      if (!valid) {
        currentChatId = chats[0].id;
        sessionStorage.setItem(CHAT_ID_KEY, String(currentChatId));
      }

      chats.forEach((c) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chat-list-item" + (c.id === currentChatId ? " active" : "");
        btn.setAttribute("role", "listitem");
        btn.textContent = (c.name && String(c.name).trim()) ? String(c.name).trim() : ("Pogovor #" + c.id);
        btn.addEventListener("click", async () => {
          currentChatId = c.id;
          sessionStorage.setItem(CHAT_ID_KEY, String(c.id));
          chatListEl.querySelectorAll(".chat-list-item").forEach((el) => el.classList.remove("active"));
          btn.classList.add("active");
          await loadChatMessages(c.id);
        });
        chatListEl.appendChild(btn);
      });
    }

    async function bootstrapChatSession() {
      const list = await api("/chat/list");
      let chats = list.chats || [];
      if (chats.length === 0) {
        const created = await api("/chat/create", { method: "POST", body: "{}" });
        currentChatId = created.chat_id;
      } else {
        const last = sessionStorage.getItem(CHAT_ID_KEY);
        if (last && chats.some((c) => String(c.id) === last)) {
          currentChatId = parseInt(last, 10);
        } else {
          currentChatId = chats[0].id;
        }
      }
      sessionStorage.setItem(CHAT_ID_KEY, String(currentChatId));
      await renderChatList();
      await loadChatMessages(currentChatId);
    }

    async function loadChatMessages(chatId) {
      const data = await api("/chat/get/" + chatId);
      messagesEl.innerHTML = "";
      const msgs = (data.chat && data.chat.messages) || [];
      msgs.forEach((m) => {
        if (m.role === "user") {
          appendUser(displayUserMessageForUi(m.content));
        } else if (m.role === "assistant") {
          appendAssistantBubble(m.content, [], null, { showSources: false });
        }
      });
      scrollMessagesToBottom();
      syncEmptyChatLayout();
    }

    /**
     * One surface for the assistant text. Optional perm-note only when some chunks were shown
     * but others were hidden (additive). Source panel only when there are chunks to show.
     */
    function appendAssistantBubble(reply, matches, numDocsNotAllowed, options) {
      const showSources = !options || options.showSources !== false;
      const matchList = matches && matches.length ? matches : [];
      const hasChunks = matchList.length > 0;
      const partialRag =
        numDocsNotAllowed != null &&
        numDocsNotAllowed > 0 &&
        hasChunks;
      const groupsToContact = (options && options.groupsToContact) || [];

      const row = document.createElement("div");
      row.className = "msg-row assistant";
      const div = document.createElement("div");
      div.className = "msg bot";

      const role = document.createElement("div");
      role.className = "msg-role";
      role.textContent = "Pomočnik";
      div.appendChild(role);

      if (partialRag) {
        const note = document.createElement("p");
        note.className = "perm-note";
        let t =
          "Število relevantnih zadetkov v indeksu, ki jih zaradi vaših pravic ne vidite: " +
          numDocsNotAllowed +
          ".";
        if (groupsToContact.length) {
          t += " Za dostop se obrnite na: " + groupsToContact.join(", ") + ".";
        }
        note.textContent = t;
        div.appendChild(note);
      }

      const answer = document.createElement("p");
      answer.className = "bot-answer";
      answer.textContent = reply && reply.trim() ? reply.trim() : "(Prazen odgovor.)";
      div.appendChild(answer);

      if (!showSources || !hasChunks) {
        row.appendChild(div);
        messagesEl.appendChild(row);
        scrollMessagesToBottom();
        syncEmptyChatLayout();
        return;
      }

      const n = matchList.length;
      const details = document.createElement("details");
      details.className = "sources-details";
      const summary = document.createElement("summary");
      summary.className = "sources-summary";
      const left = document.createElement("span");
      left.className = "sources-summary-left";
      const label = document.createElement("span");
      label.textContent = "Viri";
      const pill = document.createElement("span");
      pill.className = "count-pill";
      pill.textContent = steviloIzvlekov(n);
      left.appendChild(label);
      left.appendChild(pill);
      const chev = document.createElement("span");
      chev.className = "sources-chevron";
      chev.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      summary.appendChild(left);
      summary.appendChild(chev);
      details.appendChild(summary);

      const body = document.createElement("div");
      body.className = "sources-body";
      const hint = document.createElement("p");
      hint.className = "sources-hint";
      hint.textContent =
        "Izvleki, uporabljeni kot kontekst (že filtrirani glede na vaše skupine).";
      body.appendChild(hint);
      const grid = document.createElement("div");
      grid.className = "chunk-grid";
      matchList.forEach((m, i) => {
        const meta = m.metadata || {};
        const chunkText = meta.text != null ? String(meta.text) : "(Ni besedila v metapodatkih)";
        const card = document.createElement("article");
        card.className = "chunk-card";
        const head = document.createElement("div");
        head.className = "chunk-card-header";
        const docName = meta.document_name != null ? String(meta.document_name) : "Dokument";
        head.textContent = "Izvlek " + (i + 1) + " · " + docName;
        const textEl = document.createElement("div");
        textEl.className = "chunk-card-text";
        textEl.textContent = chunkText;
        const foot = document.createElement("div");
        foot.className = "chunk-card-meta";
        const scoreStr = m.score != null ? Number(m.score).toFixed(4) : "—";
        let metaBits = "Podobnost: " + scoreStr;
        if (meta.allowed_groups != null) {
          try {
            metaBits += " · Skupine: " + JSON.stringify(meta.allowed_groups);
          } catch (_) {}
        }
        foot.textContent = metaBits;
        card.appendChild(head);
        card.appendChild(textEl);
        card.appendChild(foot);
        grid.appendChild(card);
      });
      body.appendChild(grid);
      details.appendChild(body);
      details.addEventListener("toggle", () => {
        label.textContent = details.open ? "Skrij vire" : "Viri";
      });
      div.appendChild(details);

      row.appendChild(div);
      messagesEl.appendChild(row);
      scrollMessagesToBottom();
      syncEmptyChatLayout();
    }

    function autoResizeComposer() {
      const ta = document.getElementById("chat-input");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
    }

    document.getElementById("chat-input").addEventListener("input", autoResizeComposer);

    document.getElementById("btn-login").onclick = async () => {
      loginErr.classList.add("hidden");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const data = await api("/auth/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        setToken(data.access_token);
        const me = await api("/auth/me");
        document.getElementById("me-name").textContent = me.name;
        document.getElementById("me-groups").textContent =
          me.groups && me.groups.length ? me.groups.join(", ") : "Brez skupin";
        showChat();
        await bootstrapChatSession();
      } catch (e) {
        loginErr.textContent = e.message;
        loginErr.classList.remove("hidden");
      }
    };

    document.getElementById("btn-logout").onclick = async () => {
      try {
        await api("/auth/logout", { method: "POST", body: "{}" });
      } catch (_) {}
      showLogin();
    };

    document.getElementById("btn-send").onclick = async () => {
      chatErr.classList.add("hidden");
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      if (currentChatId == null) {
        chatErr.textContent = "Noben pogovor ni izbran.";
        chatErr.classList.remove("hidden");
        return;
      }
      input.value = "";
      input.style.height = "auto";
      appendUser(text);
      const btn = document.getElementById("btn-send");
      btn.disabled = true;
      try {
        const data = await api("/chat", {
          method: "POST",
          body: JSON.stringify({ chat_id: currentChatId, chat: text }),
        });
        appendAssistantBubble(data.response, data.allowed_matches, data.num_docs_not_allowed, {
          showSources: true,
          groupsToContact: data.groups_to_contact || [],
        });
        await renderChatList();
      } catch (e) {
        chatErr.textContent = e.message;
        chatErr.classList.remove("hidden");
        if (e.message.includes("401") || e.message.toLowerCase().includes("token")) {
          showLogin();
        }
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById("chat-input").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        document.getElementById("btn-send").click();
      }
    });

    document.getElementById("btn-new-chat").onclick = async () => {
      chatErr.classList.add("hidden");
      try {
        const created = await api("/chat/create", { method: "POST", body: "{}" });
        currentChatId = created.chat_id;
        sessionStorage.setItem(CHAT_ID_KEY, String(currentChatId));
        await renderChatList();
        messagesEl.innerHTML = "";
        syncEmptyChatLayout();
      } catch (e) {
        chatErr.textContent = e.message;
        chatErr.classList.remove("hidden");
      }
    };

    document.getElementById("btn-delete-chat").onclick = async () => {
      if (currentChatId == null) return;
      if (!confirm("Želite izbrisati ta pogovor? Tega ni mogoče razveljaviti.")) return;
      chatErr.classList.add("hidden");
      try {
        await apiDelete("/chat/delete/" + currentChatId);
        sessionStorage.removeItem(CHAT_ID_KEY);
        currentChatId = null;
        await bootstrapChatSession();
      } catch (e) {
        chatErr.textContent = e.message;
        chatErr.classList.remove("hidden");
      }
    };

    (async () => {
      const token = getToken();
      if (!token) return;
      try {
        const me = await api("/auth/me");
        document.getElementById("me-name").textContent = me.name;
        document.getElementById("me-groups").textContent =
          me.groups && me.groups.length ? me.groups.join(", ") : "Brez skupin";
        showChat();
        await bootstrapChatSession();
      } catch (_) {
        showLogin();
      }
    })();
  </script>
</body>
</html>
